repositories { google() }
apply plugin: 'com.android.application'

// Retain full POS sources in the repository; compile only this branch's client.
def simClientResources = layout.buildDirectory.dir('generated/simclient-res')
def prepareSimClientResources = tasks.register('prepareSimClientResources', Sync) {
    from('src/main/res') {
        include 'values/styles.xml'
        include 'values-v27/styles.xml'
        include 'drawable/aikapos_logo.png', 'drawable/ic_sim_settings.xml', 'drawable/ic_sim_refresh.xml'
        include 'drawable/ic_sim_camera.xml'
        include 'xml/network_security_config.xml', 'xml/age_check_paths.xml'
    }
    into(simClientResources)
}

android {
    compileSdkVersion 34
    namespace 'com.just.print'
    defaultConfig {
        applicationId "com.just.print.simclient"
        minSdkVersion 26
        targetSdkVersion 34
        versionCode 1
        versionName "1.0"
    }
    sourceSets {
        main {
            // Keep the real Java package root so Android Studio resolves package
            // declarations and same-package classes (for example IdCheckingPage)
            // correctly. Exclude the legacy POS branch from this standalone app.
            java.srcDirs = ['src/main/java']
            java.exclude 'com/just/print/app/**', 'com/just/print/db/**',
                    'com/just/print/echo/**', 'com/just/print/net/**',
                    'com/just/print/printer/**', 'com/just/print/sys/**',
                    'com/just/print/ui/**', 'com/just/print/util/**',
                    'org/cas/client/**'
            // AGP's lint model also scans Kotlin's default Java roots unless cleared.
            kotlin.srcDirs = []
            res.srcDirs = [simClientResources.get().asFile]
        }
    }
    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        // Optimized local distribution, signed with the existing debug certificate.
        // Production release signing remains the owner's release configuration.
        compact {
            initWith release
            signingConfig signingConfigs.debug
            matchingFallbacks = ['release']
        }
    }
    splits {
        abi {
            enable project.hasProperty('simClientSplitAbis')
            reset()
            include 'arm64-v8a', 'armeabi-v7a', 'x86', 'x86_64'
            universalApk true
        }
    }
    applicationVariants.all { variant ->
        variant.outputs.all { output ->
            def abi = output.getFilter(com.android.build.OutputFile.ABI)
            outputFileName = project.hasProperty('simClientSplitAbis')
                    ? "SimClient-${abi ?: 'universal'}.apk" : 'SimClient.apk'
        }

        def stageApk = tasks.register("stage${variant.name.capitalize()}SimClientApk") {
            group = 'distribution'
            description = "Prepare ${variant.name} APK as SimClient.apk for upload."
            // Package the variant before staging its APK. Do not depend on
            // assemble here because assemble already depends on this staging
            // task below, which would create a cycle.
            dependsOn variant.packageApplicationProvider
            doLast {
                def directory = layout.buildDirectory.dir("outputs/apk/${variant.dirName}").get().asFile
                def metadata = new groovy.json.JsonSlurper().parse(new File(directory, 'output-metadata.json'))
                def preferredAbi = providers.gradleProperty('simClientPublishAbi').getOrElse('arm64-v8a')
                def apk = metadata.elements.find { element ->
                    preferredAbi == 'universal' ? element.filters.isEmpty()
                            : element.filters.any { it.filterType == 'ABI' && it.value == preferredAbi }
                }
                // A normal, non-split build produces only a universal APK.
                if (apk == null && !project.hasProperty('simClientSplitAbis')) {
                    apk = metadata.elements.find { it.filters.isEmpty() }
                }
                if (apk == null) throw new GradleException("No APK for simClientPublishAbi=${preferredAbi}")
                def source = new File(directory, apk.outputFile)
                if (!source.isFile()) throw new GradleException("APK is missing: ${source}")
                def destination = layout.buildDirectory.dir("outputs/publish/${variant.name}").get().asFile
                project.copy {
                    from source
                    into destination
                    rename { 'SimClient.apk' }
                }
                logger.lifecycle("APK ready: ${new File(destination, 'SimClient.apk')}")
            }
        }
    }
    packagingOptions {
        resources {
            excludes += ['META-INF/DEPENDENCIES', 'META-INF/LICENSE', 'META-INF/LICENSE.txt', 'META-INF/license.txt', 'META-INF/NOTICE', 'META-INF/NOTICE.txt', 'META-INF/notice.txt', 'META-INF/ASL2.0', 'META-INF/*.kotlin_module']
        }
    }
}

dependencies {
    implementation 'androidx.core:core:1.9.0'
    def camerax_version = '1.3.4'
    implementation "androidx.camera:camera-camera2:${camerax_version}"
    implementation "androidx.camera:camera-lifecycle:${camerax_version}"
    implementation "androidx.camera:camera-view:${camerax_version}"
    // CameraX and the bundled OCR model request different Kotlin generations.
    implementation 'org.jetbrains.kotlin:kotlin-stdlib-jdk7:1.8.22'
    implementation 'org.jetbrains.kotlin:kotlin-stdlib-jdk8:1.8.22'
    implementation 'com.google.mlkit:text-recognition:16.0.1' // Bundled English/French OCR.
    implementation 'com.google.mlkit:barcode-scanning:17.3.0' // Offline product barcode decoding.
}

tasks.named('preBuild').configure { dependsOn prepareSimClientResources }
